_target_: src.data.nyc_vpr_joint_datamodule.NYCVPRJointDataModule

converted_vg_root: ${paths.data_dir}/NYC-Event-VPR-converted
vpr_bench_root: ${paths.data_dir}/NYC-Event-VPR

use_text: false
text_folder: null

# Place ID offset for RGB to avoid collisions with Event in joint training
rgb_place_offset: 1_000_000

img_per_place: 5
min_img_per_place: 5
resize: [224, 224]

train_batch_size: 16
infer_batch_size: 32

num_workers: 2
pin_memory: true
