# @package _global_

# Joint Event + RGB training with SACF + SCFM (visual-only, no scene descriptions).
tags: ["nyc", "joint", "sacf", "scfm", "visual_only"]

model:
  use_text: false
  lambda_contrast: 0.15
  net:
    mods:
      sacf:
        enabled: true
        variant: original
        layer_idx: 6
      scfm:
        enabled: true

data:
  use_text: false

logger:
  csv:
    name: "nyc_vpr_sacf_scfm_joint"
