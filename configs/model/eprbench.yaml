_target_: src.models.eprbench_module.EPRBenchLitModule

optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 0.0001
    weight_decay: 0.001

scheduler:
    _target_: torch.optim.lr_scheduler.StepLR
    _partial_: true
    gamma: 0.5

net:
    _target_: src.models.components.network.SGVPRNet
    pretrained_foundation: true
    foundation_model_path: ${paths.root_dir}/model/dinov2_vitb14_pretrain.pth
    use_frequency_enhance: false
    use_freq_topk: false
    freq_score_weight: 0.10
    freq_low_cut: 0.25
    freq_mid_cut: 0.60
    freq_highpass_cut: 0.25
    freq_max_gain: 0.50
    freq_gamma_init: 0.0
    mods:
        cross_spectral:
            enabled: false
            layer_idx: 6
        sacf:
            enabled: false
            layer_idx: 6
            use_event_stability: false
            use_event_cues: false
            use_semantic_score: false
            local_window_size: 3
        scfm:
            enabled: false
            use_event_reliable: false
            use_event_cues: false
        igr:
            enabled: false
            gate_threshold: 0.5
            num_groups: 16
        lgfp:
            enabled: false
            wavelet_type: haar
            padding_mode: symmetric
            enable_gaussian_smoothing: true
            high_frequency_threshold: 0.5
        fbgw:
            enabled: false
            reduction_ratio: 16
        bim:
            enabled: false
        spm:
            enabled: false
            prompt_channels: 768
            num_prompt_experts: 5
            prompt_spatial_size: 96
            router_input_dim: 768
            num_active_experts: 1
        event_cues:
            enabled: false
            patch_size: 14
        event_aware_token_selector:
            enabled: false
            rho_min: 0.15
            rho_max: 0.35
            rho_base: 0.25
            w_structure: 0.25
            w_noise: 0.20
            w_empty: 0.50
            tau: 0.07
        temporal_fusion:
            enabled: false

# Loss parameters
lambda_contrast: 0.15
temperature: 0.07

# Text toggle
use_text: true

# Feature dimension (14 * 768)
features_dim: 10752

# Inference parameters
test_method: "hard_resize"
recall_values: [1, 5, 10, 100]
infer_batch_size: 18
num_workers: 6

# PCA parameters (null to disable)
pca_dim: null

# Testing parameters
efficient_ram_testing: false
majority_weight: 0.01

# Frequency contrastive loss parameters (optional)
use_freq_contrastive_loss: false
freq_loss_weight: 0.00
freq_num_negatives: 2

# Temporal consistency loss (optional)
use_temporal_consistency: false
temporal_consistency_weight: 0.05

# Text dropout for robustness
text_dropout_prob: 0.0
word_dropout_prob: 0.0

# Compile model for increased speed
compile: false
