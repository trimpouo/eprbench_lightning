_target_: src.data.eprbench_datamodule.EPRBenchDataModule

dataset_folder: ${paths.data_dir}/EventVPR
train_batch_size: 18
infer_batch_size: 18
num_workers: 6
pin_memory: true

# Text description parameters
use_text: true
text_folder: null  # defaults to dataset_folder/scene_descriptions

# Training sampling parameters
img_per_place: 5
min_img_per_place: 5

# Image preprocessing
resize: [224, 224]
